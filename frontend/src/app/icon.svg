<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Veriflow mark. Keep in step with src/components/flow/FlowMark.tsx. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3160"/>
      <stop offset="0.5" stop-color="#252a50"/>
      <stop offset="1" stop-color="#171a38"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.75">
